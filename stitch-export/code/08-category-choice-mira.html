<script>
        // Micro-interactions for selection
        document.querySelectorAll('label').forEach(label => {
            const checkbox = label.querySelector('input[type="checkbox"]');
            
            label.addEventListener('click', () => {
                // The toggle is handled by the browser, we just ensure UI updates
                // and maybe play a tiny vibration or sound effect if desired
                if (navigator.vibrate) {
                    navigator.vibrate(5);
                }
            });
        });

        // Simple button interaction
        const nextBtn = document.querySelector('button');
        nextBtn.addEventListener('click', (e) => {
            const ripple = document.createElement('span');
            ripple.className = 'absolute inset-0 bg-white/20 rounded-full animate-ping';
            nextBtn.appendChild(ripple);
            setTimeout(() => ripple.remove(), 500);
            
            // Log selected (optional implementation)
            const selected = Array.from(document.querySelectorAll('input:checked'))
                                 .map(el => el.closest('label').querySelector('.font-headline-sm').innerText);
            console.log('Selected categories:', selected);
        });
