<!-- Footer Space -->
<footer class="pb-safe h-8"></footer>
<script>
        // Micro-interactions for calendar selection
        const dayButtons = document.querySelectorAll('#calendar-days button');
        dayButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                dayButtons.forEach(b => {
                    b.classList.remove('selected-date', 'active-ring');
                    b.classList.add('text-on-surface', 'rounded-full', 'hover:bg-surface-container-low');
                });
                btn.classList.add('selected-date', 'active-ring');
                btn.classList.remove('text-on-surface', 'rounded-full', 'hover:bg-surface-container-low');
                
                // Add a small scale effect
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => btn.style.transform = 'scale(1)', 100);
            });
        });

        // Atmospheric parallax on mouse move (desktop only)
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) / 100;
                const moveY = (e.clientY - window.innerHeight / 2) / 100;
                document.querySelector('.blur-3xl').style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        }
    </script>
