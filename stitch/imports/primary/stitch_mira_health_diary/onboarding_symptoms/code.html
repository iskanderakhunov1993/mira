<!DOCTYPE html>

<html class="dark" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-tint": "#7fde00",
                    "inverse-surface": "#ebe0dc",
                    "outline-variant": "#404a35",
                    "on-error-container": "#ffdad6",
                    "on-tertiary-fixed-variant": "#5e4200",
                    "on-error": "#690005",
                    "surface-dim": "#171210",
                    "tertiary-fixed": "#ffdea8",
                    "surface-bright": "#3e3835",
                    "error-container": "#93000a",
                    "tertiary": "#ffe7c1",
                    "on-surface-variant": "#bfcaaf",
                    "primary-fixed": "#98fc2a",
                    "on-primary-fixed-variant": "#2a5000",
                    "on-tertiary-fixed": "#271900",
                    "error": "#ffb4ab",
                    "surface-container-lowest": "#120d0b",
                    "surface-container-low": "#201a18",
                    "on-primary-container": "#356200",
                    "tertiary-container": "#ffc451",
                    "secondary-fixed-dim": "#ffb0ce",
                    "primary-fixed-dim": "#7fde00",
                    "on-background": "#ebe0dc",
                    "background": "#171210",
                    "surface-container-highest": "#3a3331",
                    "tertiary-fixed-dim": "#ffba20",
                    "surface": "#171210",
                    "on-secondary-container": "#ffebf0",
                    "primary-container": "#84e600",
                    "on-surface": "#ebe0dc",
                    "on-secondary-fixed-variant": "#8c0054",
                    "surface-container-high": "#2e2927",
                    "on-secondary": "#64003a",
                    "surface-variant": "#3a3331",
                    "outline": "#8a947b",
                    "on-secondary-fixed": "#3e0022",
                    "on-primary-fixed": "#0e2000",
                    "inverse-primary": "#3a6a00",
                    "secondary-fixed": "#ffd9e5",
                    "on-primary": "#1c3700",
                    "secondary": "#ffb0ce",
                    "surface-container": "#241e1c",
                    "secondary-container": "#d20080",
                    "inverse-on-surface": "#352f2d",
                    "primary": "#b3ff6a",
                    "on-tertiary-container": "#735100",
                    "on-tertiary": "#412d00"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xs": "4px",
                    "xl": "32px",
                    "sm": "8px",
                    "card-gap": "12px",
                    "unit": "4px",
                    "md": "16px",
                    "container-padding": "20px",
                    "lg": "24px"
            },
            "fontFamily": {
                    "headline-md": ["Manrope"],
                    "body-md": ["Inter"],
                    "headline-lg": ["Manrope"],
                    "label-sm": ["Inter"],
                    "label-md": ["Inter"],
                    "display": ["Manrope"],
                    "headline-lg-mobile": ["Manrope"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-md": ["15px", {"lineHeight": "22px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-sm": ["11px", {"lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "500"}],
                    "label-md": ["13px", {"lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "display": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "body-lg": ["17px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #050505;
            color: #ebe0dc;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .option-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-card:active {
            transform: scale(0.98);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1D1816;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #2E2826;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- Top Navigation / Progress Header -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md px-container-padding h-14 flex items-center justify-between">
<button class="p-2 -ml-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface">arrow_back_ios_new</span>
</button>
<div class="flex-1 px-lg max-w-xs">
<div class="h-1 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary w-[75%] transition-all duration-500 ease-out"></div>
</div>
<div class="flex justify-center mt-2">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Шаг 6 из 8</span>
</div>
</div>
<button class="p-2 -mr-2 active:scale-95 transition-transform opacity-0 pointer-events-none">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<main class="flex-1 flex flex-col px-container-padding pt-24 pb-32 max-w-md mx-auto w-full">
<!-- Headline Section -->
<div class="mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-md">
                Бывает ли сильная боль или симптомы, которые мешают дню?
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Это поможет настроить кнопку <span class="text-secondary font-bold">"Мне больно"</span> и отчеты.
            </p>
</div>
<!-- Atmospheric Visual Asset (Subtle Background Glow) -->
<div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden">

</div>
<!-- Options List -->
<div class="space-y-card-gap flex-1">
<!-- Option: No -->
<button class="option-card w-full p-md bg-[#1D1816] border border-[#2E2826] rounded-xl flex items-center justify-between group hover:border-outline" onclick="selectOption(this)">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">sentiment_satisfied</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Нет</span>
</div>
<div class="radio-indicator w-6 h-6 border-2 border-outline-variant rounded-full flex items-center justify-center group-[.selected]:border-primary group-[.selected]:bg-primary">
<span class="material-symbols-outlined text-on-primary scale-0 group-[.selected]:scale-100 transition-transform text-[16px]">check</span>
</div>
</button>
<!-- Option: Sometimes -->
<button class="option-card w-full p-md bg-[#1D1816] border border-[#2E2826] rounded-xl flex items-center justify-between group hover:border-outline" onclick="selectOption(this)">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">sentiment_neutral</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Иногда</span>
</div>
<div class="radio-indicator w-6 h-6 border-2 border-outline-variant rounded-full flex items-center justify-center group-[.selected]:border-primary group-[.selected]:bg-primary">
<span class="material-symbols-outlined text-on-primary scale-0 group-[.selected]:scale-100 transition-transform text-[16px]">check</span>
</div>
</button>
<!-- Option: Often (Accentuated) -->
<button class="option-card w-full p-md bg-[#1D1816] border border-secondary/30 rounded-xl flex items-center justify-between group hover:border-secondary/60" onclick="selectOption(this)">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-secondary-fixed/10 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Часто</span>
</div>
<div class="radio-indicator w-6 h-6 border-2 border-secondary/50 rounded-full flex items-center justify-center group-[.selected]:border-secondary group-[.selected]:bg-secondary">
<span class="material-symbols-outlined text-on-secondary scale-0 group-[.selected]:scale-100 transition-transform text-[16px]">check</span>
</div>
</button>
<!-- Option: Decline to Answer -->
<button class="option-card w-full p-md bg-[#1D1816] border border-[#2E2826] rounded-xl flex items-center justify-between group hover:border-outline" onclick="selectOption(this)">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">lock</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Не хочу отвечать</span>
</div>
<div class="radio-indicator w-6 h-6 border-2 border-outline-variant rounded-full flex items-center justify-center group-[.selected]:border-primary group-[.selected]:bg-primary">
<span class="material-symbols-outlined text-on-primary scale-0 group-[.selected]:scale-100 transition-transform text-[16px]">check</span>
</div>
</button>
</div>
<!-- Privacy Assurance -->
<div class="mt-xl p-md bg-[#1D1816] border border-[#2E2826] rounded-xl flex items-start gap-md">
<span class="material-symbols-outlined text-outline text-[20px] mt-xs">shield_person</span>
<p class="font-label-md text-label-md text-on-surface-variant">
                Ваши данные зашифрованы и доступны только вам. Мы используем эту информацию для повышения точности медицинских алгоритмов.
            </p>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<footer class="fixed bottom-0 w-full bg-surface/90 backdrop-blur-lg px-container-padding pt-md pb-safe-offset-8 border-t border-[#2E2826] z-50">
<div class="max-w-md mx-auto w-full">
<button class="w-full h-14 bg-primary text-on-primary font-headline-md text-headline-md rounded-full shadow-lg shadow-primary/20 active:scale-95 transition-all flex items-center justify-center gap-sm disabled:opacity-50 disabled:active:scale-100" disabled="" id="next-btn">
<span>Далее</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
<script>
        function selectOption(element) {
            // Clear existing selections
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('selected', 'ring-2', 'ring-primary', 'ring-secondary');
            });
            
            // Apply selection to clicked element
            element.classList.add('selected');
            
            // Add specific ring color based on if it's the "Often" card or not
            if (element.textContent.includes('Часто')) {
                element.classList.add('ring-2', 'ring-secondary');
            } else {
                element.classList.add('ring-2', 'ring-primary');
            }
            
            // Enable button
            document.getElementById('next-btn').disabled = false;
        }

        // Handle Safe Area for iOS
        function updateSafeArea() {
            const pbSafe = getComputedStyle(document.documentElement).getPropertyValue('--safe-area-inset-bottom');
            document.querySelector('.pb-safe-offset-8').style.paddingBottom = `calc(${pbSafe || '0px'} + 24px)`;
        }
        window.addEventListener('load', updateSafeArea);
    </script>
</body></html>
