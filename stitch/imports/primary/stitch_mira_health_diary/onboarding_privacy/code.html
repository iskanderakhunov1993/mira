<!DOCTYPE html>

<html class="dark" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            theme: {
                extend: {

                        "surface-tint": "#7fde00",
                        "inverse-surface": "#ebe0dc",

                        "on-error-container": "#ffdad6",

                        "on-error": "#690005",
                        "surface-dim": "#171210",
                        "tertiary-fixed": "#ffdea8",
                        "surface-bright": "#3e3835",
                        "error-container": "#93000a",
                        "tertiary": "#ffe7c1",
                        "on-surface-variant": "#bfcaaf",
                        "primary-fixed": "#98fc2a",
                        "on-primary-fixed-variant": "#2a5000",
                        "on-tertiary-fixed": "#271900",
                        "error": "#ffb4ab",
                        "surface-container-lowest": "#120d0b",
                        "surface-container-low": "#201a18",
                        "on-primary-container": "#356200",
                        "tertiary-container": "#ffc451",
                        "secondary-fixed-dim": "#ffb0ce",
                        "primary-fixed-dim": "#7fde00",
                        "on-background": "#ebe0dc",
                        "background": "#171210",
                        "surface-container-highest": "#3a3331",
                        "tertiary-fixed-dim": "#ffba20",
                        "surface": "#171210",
                        "on-secondary-container": "#ffebf0",
                        "primary-container": "#84e600",
                        "on-surface": "#ebe0dc",
                        "on-secondary-fixed-variant": "#8c0054",
                        "surface-container-high": "#2e2927",
                        "on-secondary": "#64003a",
                        "surface-variant": "#3a3331",
                        "outline": "#8a947b",
                        "on-secondary-fixed": "#3e0022",
                        "on-primary-fixed": "#0e2000",
                        "inverse-primary": "#3a6a00",
                        "secondary-fixed": "#ffd9e5",
                        "on-primary": "#1c3700",
                        "secondary": "#ffb0ce",
                        "surface-container": "#241e1c",
                        "secondary-container": "#d20080",
                        "inverse-on-surface": "#352f2d",
                        "primary": "#b3ff6a",
                        "on-tertiary-container": "#735100",
                        "on-tertiary": "#412d00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "xl": "32px",
                        "sm": "8px",
                        "card-gap": "12px",
                        "unit": "4px",
                        "md": "16px",
                        "container-padding": "20px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Manrope"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Manrope"],
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "display": ["Manrope"],

                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-md": ["15px", {"lineHeight": "22px", "fontWeight": "400"}],

<style>
        body {
            background-color: #050505;
            color: #ebe0dc;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .active-ring {
            box-shadow: 0 0 0 2px #b3ff6a;
        }
        .privacy-glass {
            background: rgba(29, 24, 22, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid #2E2826;
        }
        .progress-bar-track {
            background: #2A2523;
            height: 4px;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: #b3ff6a;
            height: 100%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-card {
            transition: all 0.2s ease;
        }
        .option-card:active {
            transform: scale(0.98);
            background-color: #2e2927;
        }
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen font-body-md text-body-md overflow-hidden">
<!-- Top Navigation Bar (Header) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-container-padding h-14 bg-surface/80 backdrop-blur-md border-b border-outline-variant">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="clinical_notes">clinical_notes</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Mira</span>
</div>
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="security">security</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col pt-14 px-container-padding pb-safe">
<!-- Progress Indicator -->
<div class="mt-lg mb-xl fade-in" style="animation-delay: 0.1s;">
<div class="flex justify-between items-center mb-xs">
<span class="text-label-sm font-label-sm text-on-surface-variant tracking-widest uppercase">Шаг 7 из 8</span>
<span class="text-label-sm font-label-sm text-primary">Почти готово</span>
</div>
<div class="progress-bar-track">
<div class="progress-bar-fill" style="width: 87.5%;"></div>
</div>
</div>
<!-- Hero Section -->
<div class="mb-xl fade-in" style="animation-delay: 0.2s;">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm leading-tight">Хочешь включить приватный режим?</h1>
<p class="text-on-surface-variant font-body-md text-body-md opacity-80">Mira — это твое личное пространство. Мы обеспечиваем максимальную защиту ваших данных.</p>
</div>
<!-- Privacy Visual Asset -->
<div class="relative w-full aspect-square max-h-48 mb-xl rounded-xl overflow-hidden fade-in" style="animation-delay: 0.3s;">

<div class="absolute inset-0 flex items-center justify-center">
<div class="privacy-glass p-md rounded-full flex items-center justify-center aspect-square shadow-2xl">
<span class="material-symbols-outlined text-primary text-[48px]" data-icon="shield_lock" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
</div>
</div>
</div>
<!-- Utility List Options -->
<div class="space-y-card-gap fade-in" style="animation-delay: 0.4s;">
<!-- Option 1: PIN -->
<button class="option-card w-full flex items-center gap-md p-md rounded-xl bg-surface-container border border-outline-variant text-left group" onclick="toggleActive(this)">
<div class="flex-shrink-0 w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="pin">pin</span>
</div>
<div class="flex-1">
<div class="font-label-md text-label-md text-on-surface">Установить PIN позже</div>
<div class="text-label-sm text-on-surface-variant opacity-60">Дополнительный слой защиты при входе</div>
</div>
<div class="selection-indicator w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center">
<div class="dot w-2 h-2 rounded-full bg-primary opacity-0 transition-opacity"></div>
</div>
</button>
<!-- Option 2: Sensitive Phrases -->
<button class="option-card w-full flex items-center gap-md p-md rounded-xl bg-surface-container border border-outline-variant text-left group" onclick="toggleActive(this)">
<div class="flex-shrink-0 w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</div>
<div class="flex-1">
<div class="font-label-md text-label-md text-on-surface">Скрывать чувствительные формулировки</div>
<div class="text-label-sm text-on-surface-variant opacity-60">Уведомления будут выглядеть нейтрально</div>
</div>
<div class="selection-indicator w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center">
<div class="dot w-2 h-2 rounded-full bg-primary opacity-0 transition-opacity"></div>
</div>
</button>
<!-- Option 3: Not Now -->
<button class="option-card w-full flex items-center gap-md p-md rounded-xl bg-surface-container border border-outline-variant text-left group" onclick="toggleActive(this)">
<div class="flex-shrink-0 w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</div>
<div class="flex-1">
<div class="font-label-md text-label-md text-on-surface">Пока не нужно</div>
<div class="text-label-sm text-on-surface-variant opacity-60">Вы сможете изменить это в настройках</div>
</div>
<div class="selection-indicator w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center">
<div class="dot w-2 h-2 rounded-full bg-primary opacity-0 transition-opacity"></div>
</div>
</button>
</div>
<!-- Spacer for footer clearance -->
<div class="h-32"></div>
</main>
<!-- Fixed Action Bottom Area -->
<footer class="fixed bottom-0 left-0 w-full p-container-padding bg-gradient-to-t from-background via-background to-transparent pt-lg z-50">
<button class="w-full bg-primary py-md rounded-full font-label-md text-label-md text-on-primary shadow-lg active:scale-95 transition-transform duration-150">
            Далее
        </button>
<div class="mt-md flex justify-center items-center gap-xs text-on-surface-variant opacity-40">
<span class="material-symbols-outlined text-[14px]" data-icon="lock">lock</span>
<span class="text-label-sm font-label-sm">Данные зашифрованы по протоколу AES-256</span>
</div>
</footer>
<!-- Interactive Layering Script -->
<script>
        function toggleActive(element) {
            // Remove active states from all sibling cards
            const cards = document.querySelectorAll('.option-card');
            cards.forEach(card => {
                card.classList.remove('border-primary', 'bg-surface-container-high');
                card.querySelector('.selection-indicator').classList.remove('border-primary');
                card.querySelector('.dot').classList.add('opacity-0');
            });

            // Set active state to clicked card
            element.classList.add('border-primary', 'bg-surface-container-high');
            element.querySelector('.selection-indicator').classList.add('border-primary');
            element.querySelector('.dot').classList.remove('opacity-0');
            
            // Micro-interaction haptic feedback simulation
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }
        }

        // Initialize first item as default for visual guidance if needed, 
        // but here we let the user choose (per UX "unselected" state).
    </script>
</body></html>
