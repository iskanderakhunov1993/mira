<!DOCTYPE html>

<html class="dark" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-tint": "#7fde00",
                    "inverse-surface": "#ebe0dc",
                    "outline-variant": "#404a35",
                    "on-error-container": "#ffdad6",
                    "on-tertiary-fixed-variant": "#5e4200",
                    "on-error": "#690005",
                    "surface-dim": "#171210",
                    "tertiary-fixed": "#ffdea8",
                    "surface-bright": "#3e3835",
                    "error-container": "#93000a",
                    "tertiary": "#ffe7c1",
                    "on-surface-variant": "#bfcaaf",
                    "primary-fixed": "#98fc2a",
                    "on-primary-fixed-variant": "#2a5000",
                    "on-tertiary-fixed": "#271900",
                    "error": "#ffb4ab",
                    "surface-container-lowest": "#120d0b",
                    "surface-container-low": "#201a18",
                    "on-primary-container": "#356200",
                    "tertiary-container": "#ffc451",
                    "secondary-fixed-dim": "#ffb0ce",
                    "primary-fixed-dim": "#7fde00",
                    "on-background": "#ebe0dc",
                    "background": "#171210",
                    "surface-container-highest": "#3a3331",
                    "tertiary-fixed-dim": "#ffba20",
                    "surface": "#171210",
                    "on-secondary-container": "#ffebf0",
                    "primary-container": "#84e600",
                    "on-surface": "#ebe0dc",
                    "on-secondary-fixed-variant": "#8c0054",
                    "surface-container-high": "#2e2927",
                    "on-secondary": "#64003a",
                    "surface-variant": "#3a3331",
                    "outline": "#8a947b",
                    "on-secondary-fixed": "#3e0022",
                    "on-primary-fixed": "#0e2000",
                    "inverse-primary": "#3a6a00",
                    "secondary-fixed": "#ffd9e5",
                    "on-primary": "#1c3700",
                    "secondary": "#ffb0ce",
                    "surface-container": "#241e1c",
                    "secondary-container": "#d20080",
                    "inverse-on-surface": "#352f2d",
                    "primary": "#b3ff6a",
                    "on-tertiary-container": "#735100",
                    "on-tertiary": "#412d00"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xs": "4px",
                    "xl": "32px",
                    "sm": "8px",
                    "card-gap": "12px",
                    "unit": "4px",
                    "md": "16px",
                    "container-padding": "20px",
                    "lg": "24px"
            },
            "fontFamily": {
                    "headline-md": ["Manrope"],
                    "body-md": ["Inter"],
                    "headline-lg": ["Manrope"],
                    "label-sm": ["Inter"],
                    "label-md": ["Inter"],
                    "display": ["Manrope"],
                    "headline-lg-mobile": ["Manrope"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-md": ["15px", {"lineHeight": "22px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-sm": ["11px", {"lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "500"}],
                    "label-md": ["13px", {"lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "display": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "body-lg": ["17px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #050505;
            color: #ebe0dc;
            -webkit-font-smoothing: antialiased;
        }
        .option-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-card:active {
            transform: scale(0.98);
        }
        .progress-bar-fill {
            transition: width 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }
        .custom-radio:checked + .radio-display {
            background-color: #b3ff6a;
            border-color: #b3ff6a;
        }
        .custom-radio:checked + .radio-display::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #0e2000;
            border-radius: 50%;
        }
        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="dark overflow-hidden h-screen flex flex-col">
<!-- Top Navigation -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-container-padding h-14 bg-surface dark:bg-surface border-b border-outline-variant">
<button class="w-10 h-10 flex items-center justify-start text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<div class="flex flex-col items-center">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary tracking-tight">Mira</span>
</div>
<button class="w-10 h-10 flex items-center justify-end text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined">help_outline</span>
</button>
</header>
<!-- Content Canvas -->
<main class="flex-1 mt-14 mb-24 overflow-y-auto no-scrollbar px-container-padding pt-lg">
<!-- Progress Indicator -->
<div class="mb-xl">
<div class="flex justify-between items-end mb-sm">
<span class="font-label-md text-label-md text-on-surface-variant">Шаг 4 из 8</span>
<span class="font-label-md text-label-md text-primary">50%</span>
</div>
<div class="h-1.5 w-full bg-surface-container rounded-full overflow-hidden">
<div class="progress-bar-fill h-full bg-primary rounded-full" style="width: 50%;"></div>
</div>
</div>
<!-- Headline Section -->
<div class="mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-md">Сколько обычно длятся месячные?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Это поможет нам точнее прогнозировать ваш цикл и уведомлять о начале следующей фазы.</p>
</div>
<!-- Options List -->
<div class="space-y-card-gap">
<!-- Option 1 -->
<label class="option-card relative flex items-center justify-between p-md bg-[#1D1816] border border-[#2E2826] rounded-xl cursor-pointer hover:bg-surface-container-high transition-colors group">
<input class="custom-radio hidden peer" name="duration" type="radio" value="2-3"/>
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">2-3 дня</span>
<div class="radio-display w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center relative transition-all peer-checked:border-primary peer-checked:bg-primary"></div>
</label>
<!-- Option 2 -->
<label class="option-card relative flex items-center justify-between p-md bg-[#1D1816] border border-[#2E2826] rounded-xl cursor-pointer hover:bg-surface-container-high transition-colors group">
<input checked="" class="custom-radio hidden peer" name="duration" type="radio" value="4-5"/>
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">4-5 дней</span>
<div class="radio-display w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center relative transition-all peer-checked:border-primary peer-checked:bg-primary"></div>
</label>
<!-- Option 3 -->
<label class="option-card relative flex items-center justify-between p-md bg-[#1D1816] border border-[#2E2826] rounded-xl cursor-pointer hover:bg-surface-container-high transition-colors group">
<input class="custom-radio hidden peer" name="duration" type="radio" value="6-7"/>
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">6-7 дней</span>
<div class="radio-display w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center relative transition-all peer-checked:border-primary peer-checked:bg-primary"></div>
</label>
<!-- Option 4 -->
<label class="option-card relative flex items-center justify-between p-md bg-[#1D1816] border border-[#2E2826] rounded-xl cursor-pointer hover:bg-surface-container-high transition-colors group">
<input class="custom-radio hidden peer" name="duration" type="radio" value="8+"/>
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">8+ дней</span>
<div class="radio-display w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center relative transition-all peer-checked:border-primary peer-checked:bg-primary"></div>
</label>
<!-- Option 5 -->
<label class="option-card relative flex items-center justify-between p-md bg-[#1D1816] border border-[#2E2826] rounded-xl cursor-pointer hover:bg-surface-container-high transition-colors group">
<input class="custom-radio hidden peer" name="duration" type="radio" value="unknown"/>
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">Не знаю</span>
<div class="radio-display w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center relative transition-all peer-checked:border-primary peer-checked:bg-primary"></div>
</label>
</div>
<!-- Illustration / Mood Element -->
<div class="mt-xl opacity-40 grayscale flex justify-center">
<div class="w-48 h-48 rounded-full bg-surface-container-high flex items-center justify-center border border-outline-variant">
<span class="material-symbols-outlined text-6xl text-on-surface-variant">calendar_clock</span>
</div>
</div>
</main>
<!-- Bottom Action Area -->
<footer class="fixed bottom-0 w-full p-container-padding bg-gradient-to-t from-background via-background to-transparent pt-lg">
<button class="w-full h-14 bg-primary text-on-primary font-headline-md text-headline-md rounded-full shadow-lg active:scale-95 transition-all hover:bg-primary-container hover:text-on-primary-container">
            Далее
        </button>
<div class="h-safe-area-inset-bottom mt-sm"></div>
</footer>
<!-- Interactive Layer -->
<script>
        document.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('click', () => {
                // Potential haptic feedback or transition trigger
                const radio = card.querySelector('input');
                radio.checked = true;
            });
        });

        // Simple button interaction
        const nextBtn = document.querySelector('button.bg-primary');
        nextBtn.addEventListener('click', () => {
            nextBtn.classList.add('scale-95');
            setTimeout(() => {
                nextBtn.classList.remove('scale-95');
                // Navigation logic would go here
            }, 100);
        });
    </script>
</body></html>
