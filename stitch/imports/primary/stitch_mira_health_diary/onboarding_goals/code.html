<!DOCTYPE html>

<html class="dark" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                "surface-bright": "#3e3835",
                "error-container": "#93000a",
                "tertiary": "#ffe7c1",
                "on-surface-variant": "#bfcaaf",
                "primary-fixed": "#98fc2a",
                "on-primary-fixed-variant": "#2a5000",
                "on-tertiary-fixed": "#271900",
                "error": "#ffb4ab",
                "surface-container-lowest": "#120d0b",
                "surface-container-low": "#201a18",
                "on-primary-container": "#356200",
                "tertiary-container": "#ffc451",
                "secondary-fixed-dim": "#ffb0ce",
                "primary-fixed-dim": "#7fde00",
                "on-background": "#ebe0dc",
                "background": "#171210",
                "surface-container-highest": "#3a3331",
                "tertiary-fixed-dim": "#ffba20",
                "surface": "#171210",
                "on-secondary-container": "#ffebf0",
                "primary-container": "#84e600",
                "on-surface": "#ebe0dc",
                "on-secondary-fixed-variant": "#8c0054",
                "surface-container-high": "#2e2927",
                "on-secondary": "#64003a",
                "surface-variant": "#3a3331",
                "outline": "#8a947b",
                "on-secondary-fixed": "#3e0022",
                "on-primary-fixed": "#0e2000",
                "inverse-primary": "#3a6a00",
                "secondary-fixed": "#ffd9e5",
                "on-primary": "#1c3700",
                "secondary": "#ffb0ce",
                "surface-container": "#241e1c",
                "secondary-container": "#d20080",
                "inverse-on-surface": "#352f2d",

            },
            "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
            },
            "spacing": {
                "xs": "4px",
                "xl": "32px",
                "sm": "8px",
                "card-gap": "12px",
                "unit": "4px",
                "md": "16px",
                "container-padding": "20px",
                "lg": "24px"
            },
            "fontFamily": {
                "headline-md": ["Manrope"],
                "body-md": ["Inter"],
                "headline-lg": ["Manrope"],
                "label-sm": ["Inter"],

                "body-lg": ["17px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          }
        }
      }
    </script>
<style>
        body {
            background-color: #050505;
            color: #ebe0dc;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: contain;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .selected-lime {
            background-color: #b3ff6a !important;
            color: #1c3700 !important;
            border-color: #b3ff6a !important;
        }

        .selected-pink {
            background-color: #ffb0ce !important;
            color: #3e0022 !important;
            border-color: #ffb0ce !important;
        }

        .chip-transition {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Tonal layering for the background */
        .glass-canvas {
            background: radial-gradient(circle at 50% -20%, #1D1816 0%, #050505 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-body-md-mobile flex flex-col min-h-screen glass-canvas">
<!-- Header Shell (Transactional - Suppressed Drawer but kept TopBar identity for Branding) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-container-padding h-14 w-full bg-surface/80 backdrop-blur-md border-b border-outline-variant">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">clinical_notes</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Mira</h1>
</div>
<div class="flex items-center gap-md">
<div class="w-8 h-8 rounded-full border border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">security</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-container-padding">
<!-- Progress Indicator -->
<div class="flex flex-col gap-xs mb-lg">
<div class="flex justify-between items-end mb-xs">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Шаг 5 из 8</span>
<span class="font-label-md text-label-md text-primary">62%</span>
</div>
<div class="h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary w-[62.5%] transition-all duration-700 ease-out"></div>
</div>
</div>
<!-- Typography Section -->
<section class="mb-xl">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm leading-tight">Что ты хочешь отслеживать в Mira?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Выбери основные категории для настройки Today.</p>
</section>
<!-- Grid of Tracking Chips -->
<div class="grid grid-cols-2 gap-card-gap" id="goals-grid">
<!-- Period (Pink) -->
<button class="chip-transition flex flex-col items-start p-md bg-surface-container border border-[#2E2826] rounded-xl active:scale-95 text-left group" onclick="toggleChip(this, 'pink')">
<span class="material-symbols-outlined mb-sm text-secondary group-[.selected-pink]:text-on-secondary" data-icon="calendar_today">calendar_today</span>
<span class="font-label-md text-label-md">Месячные</span>
</button>
<!-- Pain (Pink) -->
<button class="chip-transition flex flex-col items-start p-md bg-surface-container border border-[#2E2826] rounded-xl active:scale-95 text-left group" onclick="toggleChip(this, 'pink')">
<span class="material-symbols-outlined mb-sm text-secondary group-[.selected-pink]:text-on-secondary" data-icon="personal_injury">personal_injury</span>
<span class="font-label-md text-label-md">Боль</span>
</button>
<!-- Mood (Lime) -->
<button class="chip-transition flex flex-col items-start p-md bg-surface-container border border-[#2E2826] rounded-xl active:scale-95 text-left group" onclick="toggleChip(this, 'lime')">
<span class="material-symbols-outlined mb-sm text-primary group-[.selected-lime]:text-on-primary" data-icon="mood">mood</span>
<span class="font-label-md text-label-md">Настроение</span>
</button>
<!-- Energy (Lime) -->
<button class="chip-transition flex flex-col items-start p-md bg-surface-container border border-[#2E2826] rounded-xl active:scale-95 text-left group" onclick="toggleChip(this, 'lime')">
<span class="material-symbols-outlined mb-sm text-primary group-[.selected-lime]:text-on-primary" data-icon="bolt">bolt</span>
<span class="font-label-md text-label-md">Энергия</span>
</button>
<!-- Sleep (Lime) -->
<button class="chip-transition flex flex-col items-start p-md bg-surface-container border border-[#2E2826] rounded-xl active:scale-95 text-left group" onclick="toggleChip(this, 'lime')">
<span class="material-symbols-outlined mb-sm text-primary group-[.selected-lime]:text-on-primary" data-icon="bedtime">bedtime</span>
<span class="font-label-md text-label-md">Сон</span>
</button>
<!-- PMS (Pink) -->
<button class="chip-transition flex flex-col items-start p-md bg-surface-container border border-[#2E2826] rounded-xl active:scale-95 text-left group" onclick="toggleChip(this, 'pink')">
<span class="material-symbols-outlined mb-sm text-secondary group-[.selected-pink]:text-on-secondary" data-icon="warning">warning</span>
<span class="font-label-md text-label-md">ПМС</span>
</button>
<!-- Sex (Lime) -->
<button class="chip-transition flex flex-col items-start p-md bg-surface-container border border-[#2E2826] rounded-xl active:scale-95 text-left group" onclick="toggleChip(this, 'lime')">
<span class="material-symbols-outlined mb-sm text-primary group-[.selected-lime]:text-on-primary" data-icon="favorite">favorite</span>
<span class="font-label-md text-label-md">Секс/Контрацепция</span>
</button>
<!-- Notes (Lime) -->
<button class="chip-transition flex flex-col items-start p-md bg-surface-container border border-[#2E2826] rounded-xl active:scale-95 text-left group" onclick="toggleChip(this, 'lime')">
<span class="material-symbols-outlined mb-sm text-primary group-[.selected-lime]:text-on-primary" data-icon="edit_note">edit_note</span>
<span class="font-label-md text-label-md">Личные заметки</span>
</button>
</div>
<!-- Privacy Assurance Area -->
<div class="mt-xl p-md bg-surface-container-low rounded-xl border border-outline-variant/30 flex items-start gap-md">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">shield_person</span>
<div>
<h4 class="font-label-md text-label-md text-on-surface mb-xs">Ваши данные зашифрованы</h4>
<p class="text-xs text-on-surface-variant leading-relaxed">Mira использует сквозное шифрование. Ваши записи о здоровье никогда не покидают устройство без вашего разрешения.</p>
</div>
</div>
</main>
<!-- Fixed Action Bar -->
<footer class="fixed bottom-0 w-full p-container-padding bg-gradient-to-t from-background via-background to-transparent pt-10">
<button class="w-full h-14 bg-primary text-on-primary font-headline-md text-headline-md rounded-full active:scale-95 transition-transform flex items-center justify-center gap-sm shadow-lg shadow-primary/20">
            Далее
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</footer>
<script>
        function toggleChip(element, type) {
            const isSelected = element.classList.contains('selected-' + type);
            const icon = element.querySelector('.material-symbols-outlined');
            
            if (isSelected) {
                element.classList.remove('selected-' + type);
                element.classList.remove('active-state');
                icon.style.fontVariationSettings = "'FILL' 0";
            } else {
                element.classList.add('selected-' + type);
                element.classList.add('active-state');
                icon.style.fontVariationSettings = "'FILL' 1";
            }
            
            // Haptic feedback simulation
            if (window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }

        // Simple entry animation for chips
        document.addEventListener('DOMContentLoaded', () => {
            const chips = document.querySelectorAll('#goals-grid button');
            chips.forEach((chip, index) => {
                chip.style.opacity = '0';
                chip.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    chip.style.transition = 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    chip.style.opacity = '1';
                    chip.style.transform = 'translateY(0)';
                }, index * 60);
            });
        });
    </script>
</body></html>
