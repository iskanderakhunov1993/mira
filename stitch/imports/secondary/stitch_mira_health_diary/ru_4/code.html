<!DOCTYPE html>

<html class="dark" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Mira | Лог контекста</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            background-color: #050505;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .glass-card {
            background: #1D1816;
            border: 1px solid #2E2826;
        }
        .inset-control {
            background: #2A2523;
        }
        .active-chip {
            background-color: #b3ff6a;
            color: #1c3700;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline-variant": "#404a35",
                    "on-secondary-fixed": "#3e0022",
                    "primary": "#b3ff6a",
                    "outline": "#8a947b",
                    "surface-container": "#241e1c",
                    "surface-container-lowest": "#120d0b",
                    "secondary-fixed-dim": "#ffb0ce",
                    "on-error-container": "#ffdad6",
                    "error-container": "#93000a",
                    "on-error": "#690005",
                    "primary-container": "#84e600",
                    "on-primary-container": "#356200",
                    "surface-container-low": "#201a18",
                    "surface": "#171210",
                    "inverse-on-surface": "#352f2d",
                    "inverse-surface": "#ebe0dc",
                    "on-primary-fixed": "#0e2000",
                    "on-background": "#ebe0dc",
                    "tertiary-fixed": "#ffdea8",
                    "on-primary-fixed-variant": "#2a5000",
                    "surface-container-highest": "#3a3331",
                    "on-tertiary-container": "#735100",
                    "on-tertiary": "#412d00",
                    "surface-bright": "#3e3835",
                    "on-tertiary-fixed-variant": "#5e4200",
                    "background": "#171210",
                    "surface-container-high": "#2e2927",
                    "tertiary": "#ffe7c1",
                    "inverse-primary": "#3a6a00",
                    "secondary-fixed": "#ffd9e5",
                    "tertiary-container": "#ffc451",
                    "secondary": "#ffb0ce",
                    "on-secondary-fixed-variant": "#8c0054",
                    "on-tertiary-fixed": "#271900",
                    "primary-fixed-dim": "#7fde00",
                    "surface-dim": "#171210",
                    "surface-variant": "#3a3331",
                    "tertiary-fixed-dim": "#ffba20",
                    "secondary-container": "#d20080",
                    "on-secondary-container": "#ffebf0",
                    "on-primary": "#1c3700",
                    "error": "#ffb4ab",
                    "surface-tint": "#7fde00",
                    "primary-fixed": "#98fc2a",
                    "on-secondary": "#64003a",
                    "on-surface-variant": "#bfcaaf",
                    "on-surface": "#ebe0dc"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "sm": "8px",
                    "xl": "32px",
                    "md": "16px",
                    "lg": "24px",
                    "card-gap": "12px",
                    "container-padding": "20px",
                    "xs": "4px",
                    "unit": "4px"
            },
            "fontFamily": {
                    "headline-md": ["Manrope"],
                    "headline-lg-mobile": ["Manrope"],
                    "display": ["Manrope"],
                    "label-md": ["Inter"],
                    "headline-lg": ["Manrope"],
                    "body-lg": ["Inter"],
                    "label-sm": ["Inter"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "display": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-md": ["13px", {"lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["17px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-sm": ["11px", {"lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "500"}],
                    "body-md": ["15px", {"lineHeight": "22px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline-variant flex justify-between items-center px-container-padding h-14 w-full">
<div class="flex items-center gap-sm active:scale-95 transition-transform cursor-pointer">
<span class="material-symbols-outlined text-primary" data-icon="clinical_notes">clinical_notes</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Mira</h1>
</div>
<div class="flex items-center gap-md">
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-variant p-2 rounded-full transition-colors" data-icon="security">security</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-20 pb-24 px-container-padding max-w-lg mx-auto">
<div class="mb-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Лог: Контекст</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Ежедневный контекст вашего образа жизни.</p>
</div>
<div class="flex flex-col gap-card-gap">
<!-- Section 1: Hydration -->
<section class="glass-card p-md rounded-xl">
<div class="flex items-center justify-between mb-md">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="water_drop">water_drop</span>
<h3 class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant">ВОДА</h3>
</div>
<span class="font-label-md text-label-md text-primary" id="water-val">1.0 Л</span>
</div>
<div class="relative w-full h-12 inset-control rounded-lg flex items-center px-xs">
<input class="w-full h-2 bg-outline-variant rounded-lg appearance-none cursor-pointer accent-primary" max="4" min="0" oninput="document.getElementById('water-val').innerText = (this.value * 0.5).toFixed(1) + (this.value == 4 ? '+' : '') + ' Л'" step="1" type="range" value="2"/>
</div>
<div class="flex justify-between mt-sm px-1">
<span class="font-label-sm text-label-sm text-on-surface-variant">0Л</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">1Л</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">2Л+</span>
</div>
</section>
<!-- Section 2: Movement -->
<section class="glass-card p-md rounded-xl">
<div class="flex items-center gap-sm mb-md">
<span class="material-symbols-outlined text-primary" data-icon="directions_walk">directions_walk</span>
<h3 class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant">ДВИЖЕНИЕ</h3>
</div>
<div class="grid grid-cols-4 gap-sm">
<button class="flex flex-col items-center gap-xs p-sm rounded-lg inset-control hover:bg-surface-variant transition-colors group active:scale-95" onclick="toggleActive(this)">
<span class="material-symbols-outlined text-on-surface-variant group-[.active-chip]:text-on-primary" data-icon="person_off">person_off</span>
<span class="font-label-sm text-label-sm">Почти нет</span>
</button>
<button class="flex flex-col items-center gap-xs p-sm rounded-lg inset-control hover:bg-surface-variant transition-colors group active:scale-95" onclick="toggleActive(this)">
<span class="material-symbols-outlined text-on-surface-variant group-[.active-chip]:text-on-primary" data-icon="stroller">stroller</span>
<span class="font-label-sm text-label-sm">Немного</span>
</button>
<button class="flex flex-col items-center gap-xs p-sm rounded-lg inset-control hover:bg-surface-variant transition-colors group active:scale-95 active-chip" onclick="toggleActive(this)">
<span class="material-symbols-outlined text-on-primary" data-icon="directions_run">directions_run</span>
<span class="font-label-sm text-label-sm">Обычное</span>
</button>
<button class="flex flex-col items-center gap-xs p-sm rounded-lg inset-control hover:bg-surface-variant transition-colors group active:scale-95" onclick="toggleActive(this)">
<span class="material-symbols-outlined text-on-surface-variant group-[.active-chip]:text-on-primary" data-icon="bolt">bolt</span>
<span class="font-label-sm text-label-sm">Много</span>
</button>
</div>
</section>
<!-- Section 3: Training Load & Pain Hint -->
<section class="glass-card p-md rounded-xl border-primary/20">
<div class="flex items-center gap-sm mb-md">
<span class="material-symbols-outlined text-primary" data-icon="fitness_center">fitness_center</span>
<h3 class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant">НАГРУЗКА</h3>
</div>
<!-- Intensity Indicator Hint -->
<div class="mb-md flex items-start gap-sm p-sm bg-primary/10 rounded-lg border border-primary/20">
<span class="material-symbols-outlined text-primary text-[18px]" data-icon="info">info</span>
<p class="font-label-sm text-label-sm text-primary leading-tight">Отмечена боль в спине. Рекомендуем снизить нагрузку сегодня.</p>
</div>
<div class="flex flex-wrap gap-sm">
<button class="px-md py-sm rounded-full inset-control font-label-md text-label-md border border-outline-variant hover:border-primary transition-all" onclick="selectOnly(this)">Нет</button>
<button class="px-md py-sm rounded-full inset-control font-label-md text-label-md border border-outline-variant hover:border-primary transition-all active-chip" onclick="selectOnly(this)">Лёгкая</button>
<button class="px-md py-sm rounded-full inset-control font-label-md text-label-md border border-outline-variant hover:border-primary transition-all" onclick="selectOnly(this)">Средняя</button>
<button class="px-md py-sm rounded-full inset-control font-label-md text-label-md border border-outline-variant hover:border-primary transition-all" onclick="selectOnly(this)">Высокая</button>
</div>
</section>
<!-- Section 4: Food Context -->
<section class="glass-card p-md rounded-xl">
<div class="flex items-center gap-sm mb-md">
<span class="material-symbols-outlined text-primary" data-icon="restaurant">restaurant</span>
<h3 class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant">ЕДА</h3>
</div>
<div class="flex flex-wrap gap-sm">
<button class="px-md py-sm rounded-lg inset-control flex items-center gap-sm group" onclick="toggleActive(this)">
<span class="material-symbols-outlined text-on-surface-variant group-[.active-chip]:text-on-primary" data-icon="done">done</span>
<span class="font-label-sm text-label-sm">Обычно</span>
</button>
<button class="px-md py-sm rounded-lg inset-control flex items-center gap-sm group" onclick="toggleActive(this)">
<span class="material-symbols-outlined text-on-surface-variant group-[.active-chip]:text-on-primary" data-icon="remove">remove</span>
<span class="font-label-sm text-label-sm">Мало</span>
</button>
<button class="px-md py-sm rounded-lg inset-control flex items-center gap-sm group" onclick="toggleActive(this)">
<span class="material-symbols-outlined text-on-surface-variant group-[.active-chip]:text-on-primary" data-icon="ice_cream">icecream</span>
<span class="font-label-sm text-label-sm">Сладкое</span>
</button>
<button class="px-md py-sm rounded-lg inset-control flex items-center gap-sm group" onclick="toggleActive(this)">
<span class="material-symbols-outlined text-on-surface-variant group-[.active-chip]:text-on-primary" data-icon="layers">layers</span>
<span class="font-label-sm text-label-sm">Тяжёлая</span>
</button>
<button class="px-md py-sm rounded-lg inset-control flex items-center gap-sm group" onclick="toggleActive(this)">
<span class="material-symbols-outlined text-on-surface-variant group-[.active-chip]:text-on-primary" data-icon="sync_problem">sync_problem</span>
<span class="font-label-sm text-label-sm">Нерегулярно</span>
</button>
<button class="px-md py-sm rounded-lg inset-control flex items-center gap-sm group" onclick="toggleActive(this)">
<span class="material-symbols-outlined text-on-surface-variant group-[.active-chip]:text-on-primary" data-icon="event_busy">event_busy</span>
<span class="font-label-sm text-label-sm">Пропуск</span>
</button>
</div>
</section>
<!-- Section 5: Weight -->
<section class="glass-card p-md rounded-xl">
<div class="flex items-center justify-between">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="monitor_weight">monitor_weight</span>
<h3 class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant">ВЕС</h3>
</div>
<div class="flex items-center gap-xs">
<input class="w-20 bg-transparent text-right font-headline-md text-headline-md text-primary border-none focus:ring-0 placeholder-surface-container-highest" placeholder="--" step="0.1" type="number"/>
<span class="font-body-md text-body-md text-on-surface-variant">кг</span>
</div>
</div>
</section>
<!-- Section 6: Skin & Hair -->
<section class="glass-card p-md rounded-xl">
<div class="flex items-center gap-sm mb-md">
<span class="material-symbols-outlined text-primary" data-icon="face">face</span>
<h3 class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant">КОЖА И ВОЛОСЫ</h3>
</div>
<div class="space-y-sm">
<label class="flex items-center justify-between p-sm rounded-lg inset-control cursor-pointer border border-transparent hover:border-outline-variant transition-all">
<span class="font-body-md text-body-md">Акне</span>
<input class="w-6 h-6 rounded-full border-2 border-outline-variant bg-transparent text-primary focus:ring-0 checked:bg-primary" type="checkbox"/>
</label>
<label class="flex items-center justify-between p-sm rounded-lg inset-control cursor-pointer border border-transparent hover:border-outline-variant transition-all">
<span class="font-body-md text-body-md">Сухость</span>
<input class="w-6 h-6 rounded-full border-2 border-outline-variant bg-transparent text-primary focus:ring-0 checked:bg-primary" type="checkbox"/>
</label>
<label class="flex items-center justify-between p-sm rounded-lg inset-control cursor-pointer border border-transparent hover:border-outline-variant transition-all">
<span class="font-body-md text-body-md">Жирность</span>
<input class="w-6 h-6 rounded-full border-2 border-outline-variant bg-transparent text-primary focus:ring-0 checked:bg-primary" type="checkbox"/>
</label>
<label class="flex items-center justify-between p-sm rounded-lg inset-control cursor-pointer border border-transparent hover:border-outline-variant transition-all">
<span class="font-body-md text-body-md">Выпадение волос</span>
<input class="w-6 h-6 rounded-full border-2 border-outline-variant bg-transparent text-primary focus:ring-0 checked:bg-primary" type="checkbox"/>
</label>
<label class="flex items-center justify-between p-sm rounded-lg inset-control cursor-pointer border border-transparent hover:border-outline-variant transition-all">
<span class="font-body-md text-body-md">Отечность</span>
<input class="w-6 h-6 rounded-full border-2 border-outline-variant bg-transparent text-primary focus:ring-0 checked:bg-primary" type="checkbox"/>
</label>
</div>
</section>
<!-- Save Action -->
<button class="mt-md w-full bg-primary py-lg rounded-xl font-headline-md text-headline-md text-on-primary active:scale-95 transition-all shadow-lg shadow-primary/20">
                Сохранить лог
            </button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container border-t border-outline-variant flex justify-around items-center h-16 w-full px-xs">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:opacity-80 active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="calendar_today">calendar_today</span>
<span class="font-label-sm text-label-sm">Сегодня</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:opacity-80 active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="edit_note">edit_note</span>
<span class="font-label-sm text-label-sm">Трек</span>
</button>
<button class="flex flex-col items-center justify-center text-primary dark:text-primary font-bold hover:opacity-80 active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="self_care" style="font-variation-settings: 'FILL' 1;">self_care</span>
<span class="font-label-sm text-label-sm">Контекст</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:opacity-80 active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="insights">insights</span>
<span class="font-label-sm text-label-sm">Анализ</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:opacity-80 active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="description">description</span>
<span class="font-label-sm text-label-sm">Отчёт</span>
</button>
</nav>
<script>
        function toggleActive(btn) {
            btn.classList.toggle('active-chip');
            const icon = btn.querySelector('.material-symbols-outlined');
            const isFilled = btn.classList.contains('active-chip');
            
            if (isFilled) {
                icon.style.fontVariationSettings = "'FILL' 1";
                icon.classList.remove('text-on-surface-variant');
                icon.classList.add('text-on-primary');
            } else {
                icon.style.fontVariationSettings = "'FILL' 0";
                icon.classList.add('text-on-surface-variant');
                icon.classList.remove('text-on-primary');
            }
        }

        function selectOnly(btn) {
            const container = btn.parentElement;
            const buttons = container.querySelectorAll('button');
            buttons.forEach(b => b.classList.remove('active-chip'));
            btn.classList.add('active-chip');
        }
    </script>
</body></html>
