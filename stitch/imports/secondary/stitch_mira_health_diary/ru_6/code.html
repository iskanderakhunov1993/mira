<script>
        // Simple micro-interaction for tapping cards
        document.querySelectorAll('.bento-grid button').forEach(button => {
            button.addEventListener('click', function() {
                this.classList.toggle('bg-primary-container');
                this.classList.toggle('text-on-primary-container');
                const icon = this.querySelector('.material-symbols-outlined');
                if (icon) {
                    const isFilled = icon.style.fontVariationSettings.includes("'FILL' 1");
                    icon.style.fontVariationSettings = isFilled ? "'FILL' 0" : "'FILL' 1";
                }
            });
        });

        // Horizontal scroll animation for date picker
        const daySelector = document.querySelector('.custom-scrollbar');
        let isDown = false;
        let startX;
        let scrollLeft;

        daySelector.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - daySelector.offsetLeft;
            scrollLeft = daySelector.scrollLeft;
        });
        daySelector.addEventListener('mouseleave', () => { isDown = false; });
        daySelector.addEventListener('mouseup', () => { isDown = false; });
        daySelector.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - daySelector.offsetLeft;
            const walk = (x - startX) * 2;
            daySelector.scrollLeft = scrollLeft - walk;
        });
    </script>
